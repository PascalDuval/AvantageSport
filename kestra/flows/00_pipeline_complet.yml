# =============================================================
# Flow Kestra 00 — Pipeline Complet (correction Round 5)
# Namespace : poc.avantages_sportifs
# Déclenche : manuellement (démo / restitution)
#
# Corrections Kestra 1.3.x appliquées (cf README §7.12) :
#   - io.kestra.plugin.flow.Subflow → io.kestra.plugin.core.flow.Subflow
#   - type: INTEGER → type: INT
#
# Orchestre les 5 flows dans l'ordre logique :
#   01 ingest → 02 generate → 03 etl → 04 quality → 05 notify
# Alerting : canal Slack #alerting sur échec (vars.SLACK_ALERT_WEBHOOK_URL)
# Retry : health_check 3×/10 s
# =============================================================
id: pipeline_complet
namespace: poc.avantages_sportifs

labels:
  round: "4-5"
  type: orchestration
  criticality: high
  alerting: slack

description: |
  Flow maître : orchestre les 5 flows du pipeline dans l'ordre.
  Utilisé pour la démo et la restitution.
  En cas d'échec du Quality Check SODA (flow 04), le pipeline continue
  sans être bloqué (transmitFailed = false) sauf si fail_fast=true.

inputs:
  - id: skip_gmaps
    type: BOOLEAN
    defaults: false
  - id: fail_fast_qc
    type: BOOLEAN
    defaults: false
    description: "Bloquer si une règle BLOQUANTE du QC échoue"

tasks:

  - id: log_start
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "▶ DÉBUT pipeline_complet | exec={{ execution.id }}"

  - id: health_check
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/health"
    method: GET
    description: "Vérifier que Flask Entry est accessible avant de démarrer"
    retry:
      type: constant
      interval: PT10S
      maxAttempt: 3

  - id: step_01_ingest
    type: io.kestra.plugin.core.flow.Subflow
    namespace: poc.avantages_sportifs
    flowId: ingest_xlsx
    wait: true
    transmitFailed: true
    description: "Étape 1 : chargement XLSX → raw_rh + raw_sport"

  - id: step_02_generate
    type: io.kestra.plugin.core.flow.Subflow
    namespace: poc.avantages_sportifs
    flowId: generate_strava
    wait: true
    transmitFailed: true
    description: "Étape 2 : re-simulation Monte Carlo (optionnel)"

  - id: step_03_etl
    type: io.kestra.plugin.core.flow.Subflow
    namespace: poc.avantages_sportifs
    flowId: etl_silver_gold
    wait: true
    transmitFailed: true
    description: "Étape 3 : ETL Silver + Gold (employees + avantages_calcules)"

  - id: step_04_quality
    type: io.kestra.plugin.core.flow.Subflow
    namespace: poc.avantages_sportifs
    flowId: quality_check
    wait: true
    transmitFailed: false
    description: "Étape 4 : Quality Check SODA — 11 règles SodaCL"

  - id: step_05_notify
    type: io.kestra.plugin.core.flow.Subflow
    namespace: poc.avantages_sportifs
    flowId: notify_slack
    wait: true
    transmitFailed: false
    description: "Étape 5 : notifications Slack #social (activités manuelles récentes)"

  - id: log_completion
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "✅ pipeline_complet terminé | exec={{ execution.id }} | stats=http://localhost:5001/api/stats | rapport=reports/soda_quality_report.html"

errors:

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "❌ ÉCHEC pipeline_complet | exec={{ execution.id }} | Vérifiez l'exécution dans Kestra UI"

  - id: slack_alert
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.SLACK_ALERT_WEBHOOK_URL }}"
    method: POST
    contentType: application/json
    body: |
      {"text":"🚨 *[ALERTE POC]* Flow `{{ flow.id }}` en échec","blocks":[{"type":"header","text":{"type":"plain_text","text":"🚨 Alerte Pipeline — POC Avantages Sportifs","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":"*Flow :*\n`{{ flow.id }}`"},{"type":"mrkdwn","text":"*Exécution :*\n`{{ execution.id }}`"},{"type":"mrkdwn","text":"*Statut :*\n❌  ÉCHEC"},{"type":"mrkdwn","text":"*Cause :*\nPipeline complet interrompu — une étape critique a échoué"}]},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"🔍 Voir dans Kestra","emoji":true},"url":"http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"}]}]}
