# ═══════════════════════════════════════════════════════════════
# Flow Kestra 04 — Contrôles Qualité (SODA Core)
# Namespace : poc.avantages_sportifs
# Déclenche : après etl_silver_gold, ou manuellement
#
# Action : appelle POST /api/quality/soda
#          → src/soda_runner.py (11 règles SodaCL)
#          → soda/checks/employees.yml          (6 règles Silver)
#          → soda/checks/strava_activities.yml  (3 règles Bronze)
#          → soda/checks/avantages_calcules.yml (2 règles Gold)
#          → data_quality_results + reports/soda_quality_report.html
#
# Qualité v1 (SQL maison) conservée en référence : src/quality_check.py
# Disponible via POST /api/quality si besoin de comparaison.
# Alerting : canal Slack #alerting sur échec (envs.SLACK_ALERT_WEBHOOK_URL)
# Retry : health_check 3×/10 s · run_quality 2×/20 s
# ═══════════════════════════════════════════════════════════════
id: quality_check
namespace: poc.avantages_sportifs

labels:
  round: "3"
  engine: "soda-core-postgres"
  criticality: high
  alerting: slack

description: |
  Contrôles qualité SODA Core — 11 règles SodaCL déclaratives.
  Tables : employees (Silver), strava_activities (Bronze), avantages_calcules (Gold).
  Génère le rapport HTML dans reports/soda_quality_report.html.
  En cas de BLOQUANT : log ERROR mais ne bloque pas le flow suivant
  (transmitFailed = false dans pipeline_complet).

inputs:
  - id: suite
    type: STRING
    defaults: all
    description: "'all', 'employees', 'strava', ou 'gold'"
  - id: fail_fast
    type: BOOLEAN
    defaults: false
    description: "Stopper dès le premier BLOQUANT détecté"

tasks:

  - id: log_start
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "▶ DÉBUT quality_check SODA | suite={{ inputs.suite }} | exec={{ execution.id }}"

  - id: health_check
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/health"
    method: GET
    description: "Vérifier que Flask Entry est accessible"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: run_quality
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/api/quality/soda"
    method: POST
    contentType: application/json
    body: '{"suite": "all", "fail_fast": false}'
    description: "11 règles SodaCL → data_quality_results + rapport HTML"
    retry:
      type: constant
      interval: PT20S
      maxAttempts: 2

  - id: log_result
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "✅ quality_check SODA terminé | exec={{ execution.id }} | résultat={{ outputs.run_quality.body }} | rapport=reports/soda_quality_report.html"

errors:

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "❌ ÉCHEC quality_check | exec={{ execution.id }} | Voir reports/soda_quality_report.html et logs/soda_runner.log"

  - id: slack_alert
    type: io.kestra.plugin.core.http.Request
    uri: "{{ envs.SLACK_ALERT_WEBHOOK_URL }}"
    method: POST
    contentType: application/json
    body: |
      {"text":"🚨 *[ALERTE POC]* Flow `{{ flow.id }}` en échec","blocks":[{"type":"header","text":{"type":"plain_text","text":"🚨 Alerte Pipeline — POC Avantages Sportifs","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":"*Flow :*\n`{{ flow.id }}`"},{"type":"mrkdwn","text":"*Exécution :*\n`{{ execution.id }}`"},{"type":"mrkdwn","text":"*Statut :*\n❌  ÉCHEC"},{"type":"mrkdwn","text":"*Cause :*\nQuality Check SODA — règle BLOQUANTE ou scan KO"}]},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"🔍 Voir dans Kestra","emoji":true},"url":"http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"}]}]}
