# ═══════════════════════════════════════════════════════════════
# Flow Kestra 04 — Contrôles Qualité
# Namespace : poc.avantages_sportifs
# Déclenche : après etl_silver_gold, ou manuellement
#
# Action : appelle POST /api/quality
#          → src/quality_check.py (9 règles SQL)
#          → data_quality_results + reports/quality_report.html
# ═══════════════════════════════════════════════════════════════
id: quality_check
namespace: poc.avantages_sportifs

labels:
  round: "4"

description: |
  Exécute les 9 règles qualité SQL sur les données Silver et Bronze.
  Génère le rapport HTML dans reports/quality_report.html.
  En cas de BLOQUANT : log ERROR mais ne bloque pas le flow suivant
  (sauf si fail_fast = true).

inputs:
  - id: suite
    type: STRING
    defaults: all
    description: "'all', 'silver' ou 'bronze'"
  - id: fail_fast
    type: BOOLEAN
    defaults: false
    description: "Stopper dès le premier BLOQUANT"

tasks:

  - id: health_check
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/health"
    method: GET

  - id: run_quality
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/api/quality"
    method: POST
    contentType: application/json
    body: '{"suite": "all", "fail_fast": false}'
    description: "9 règles SQL → data_quality_results + rapport HTML"

  - id: log_result
    type: io.kestra.plugin.core.log.Log
    message: "Quality check terminé. Résultat : {{ outputs.run_quality.body }}"

errors:
  - id: on_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "ECHEC quality_check — Voir reports/quality_report.html"
