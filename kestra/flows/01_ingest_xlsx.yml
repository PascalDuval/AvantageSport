# ═══════════════════════════════════════════════════════════════
# Flow Kestra 01 — Ingestion XLSX
# Namespace : poc.avantages_sportifs
# Déclenche : manuellement ou depuis pipeline_complet
#
# Action : appelle POST /api/ingest → raw_rh + raw_sport
# Alerting : canal Slack #alerting sur échec (vars.SLACK_ALERT_WEBHOOK_URL)
# Retry : health_check 3×/10 s · run_ingest 2×/30 s
# ═══════════════════════════════════════════════════════════════
id: ingest_xlsx
namespace: poc.avantages_sportifs

labels:
  round: "4"
  equipe: poc-sport
  criticality: high
  alerting: slack

description: |
  Charge les fichiers XLSX (Données RH et Sportives) dans les tables
  brutes PostgreSQL raw_rh et raw_sport.
  Prérequis : Flask Entry démarré (python src/flask_entry.py).

inputs:
  - id: dry_run
    type: BOOLEAN
    defaults: false
    description: "Si true : affiche sans insérer en base"

tasks:

  - id: log_start
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "▶ DÉBUT ingest_xlsx | exec={{ execution.id }}"

  - id: health_check
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/health"
    method: GET
    description: "Vérifie que Flask Entry est disponible"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: run_ingest
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:5001/api/ingest"
    method: POST
    contentType: application/json
    body: '{"dry_run": false}'
    description: "Lance src/ingest_xlsx.py"
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT120S
      maxAttempts: 2

  - id: log_result
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "✅ ingest_xlsx terminé | exec={{ execution.id }} | résultat={{ outputs.run_ingest.body }}"

errors:

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "❌ ÉCHEC ingest_xlsx | exec={{ execution.id }} | Vérifiez Flask :5001 et les XLSX dans data/raw/"

  - id: slack_alert
    type: io.kestra.plugin.core.http.Request
    uri: "{{ envs.SLACK_ALERT_WEBHOOK_URL }}"
    method: POST
    contentType: application/json
    body: |
      {"text":"🚨 *[ALERTE POC]* Flow `{{ flow.id }}` en échec","blocks":[{"type":"header","text":{"type":"plain_text","text":"🚨 Alerte Pipeline — POC Avantages Sportifs","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":"*Flow :*\n`{{ flow.id }}`"},{"type":"mrkdwn","text":"*Exécution :*\n`{{ execution.id }}`"},{"type":"mrkdwn","text":"*Statut :*\n❌  ÉCHEC"},{"type":"mrkdwn","text":"*Cause :*\nIngestion XLSX — Flask ou fichiers XLSX manquants"}]},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"🔍 Voir dans Kestra","emoji":true},"url":"http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"}]}]}
